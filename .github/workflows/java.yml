name: Java CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  all:
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-26.04-arm

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4
    - name: apt update
      run: sudo apt update
    - name: Install tools
      run: sudo apt install -y default-jdk maven
    - name: Build and test with Maven
      run: mvn -B verify --file java/pom.xml
