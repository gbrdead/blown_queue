name: Java CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  all:
    strategy:
      matrix:
        os:
          - ubuntu-26.04
          - ubuntu-26.04-arm

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7
    
      - name: apt update
        run: sudo apt update
      
      - name: Install tools
        run: sudo apt install -y default-jdk maven
      
      - name: mvn verify
        working-directory: java
        run: mvn -B verify
